<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldenGrad — недвижимость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --gold-dark: #9c7214;
      --gold-mid: #d4a838;
      --gold-light: #fff3c4;
      --text: #1f1b12;
      --muted: #6c6350;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.85);
      --wa: #22c55e;
      --danger: #dc2626;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: var(--text);
      background: linear-gradient(225deg, #ffffff 0%, #fffdf5 45%, #fce8a6 100%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    header {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 168, 56, 0.25);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-shimmer {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      background: linear-gradient(115deg, #9c7214 15%, #f5c84c 38%, #fffbe0 50%, #f5c84c 62%, #9c7214 85%);
      background-size: 220% auto;
      animation: shimmer 3.5s linear infinite;
      -webkit-mask-image: url("logo.png");
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url("logo.png");
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(115deg, #9c7214 15%, #e0b038 40%, #fff6cc 50%, #e0b038 60%, #9c7214 85%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 3.5s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.98); }

    .btn-wa {
      background: var(--wa);
      color: #fff;
    }

    .btn-admin {
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(156, 114, 20, 0.25);
    }

    .btn-gold {
      background: linear-gradient(135deg, #e5ba45, #c79520);
      color: #1c1607;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.75);
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .filters-panel {
      background: var(--glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(156, 114, 20, 0.08);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .search-row { grid-template-columns: 1fr; }
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(156, 114, 20, 0.22);
      background: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--gold-mid);
    }

    .textarea { min-height: 90px; resize: vertical; }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 4px;
    }

    .chip {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(156, 114, 20, 0.25);
      background: rgba(255, 255, 255, 0.78);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: linear-gradient(135deg, #e7bc48, #c99722);
      color: #1a1406;
      border-color: transparent;
    }

    .price-filter-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .price-custom-input {
      width: 175px;
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid rgba(156, 114, 20, 0.25);
      background: #fff;
      font-family: inherit;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(156, 114, 20, 0.08);
      transition: transform 0.18s ease;
    }

    .card:hover { transform: translateY(-3px); }

    .card-img-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: rgba(255, 248, 220, 0.7);
      cursor: pointer;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }

    .badge {
      background: rgba(25, 21, 12, 0.78);
      color: #fff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    .badge-gold {
      background: rgba(235, 190, 65, 0.92);
      color: #1a1406;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold-dark);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .card-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-sm {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-weight: 600;
    }

    .admin-box {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 22px;
      display: none;
    }

    .admin-box.open { display: block; }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    @media (max-width: 720px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    .full-col { grid-column: 1 / -1; }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--muted);
    }

    .districts-manage {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .district-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid rgba(156, 114, 20, 0.25);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .district-pill button {
      border: none;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-weight: 800;
    }

    .existing-photos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .photo-thumb {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.12);
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-thumb button {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 6, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fffdf7;
      border-radius: 20px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-close {
      border: none;
      background: rgba(0,0,0,0.06);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 14px;
    }

    .modal-gallery img {
      height: 220px;
      border-radius: 14px;
      object-fit: cover;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1c180d;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 90;
      display: none;
      max-width: 360px;
    }

    .toast.show { display: block; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 24px 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#top" class="brand" id="resetHome">
        <div class="logo-shimmer" aria-label="GoldenGrad"></div>
        <span class="brand-title">GOLDEN GRAD</span>
      </a>
      <div class="top-actions">
        <a href="#" id="generalWaBtn" target="_blank" class="btn btn-wa">WhatsApp</a>
        <button type="button" id="adminToggleBtn" class="btn btn-admin">✏️ Админ</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- АДМИН-ПАНЕЛЬ -->
    <section id="adminPanel" class="admin-box">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h2 id="flatFormTitle" style="font-size:17px;">Добавить новую квартиру</h2>
        <div style="display:flex; gap:8px;">
          <button type="button" id="cancelEditBtn" class="btn btn-ghost btn-sm" style="display:none;">Отменить редактирование</button>
          <button type="button" id="logoutAdminBtn" class="btn btn-ghost btn-sm">Выйти</button>
        </div>
      </div>

      <form id="flatForm" class="admin-grid">
        <div>
          <label class="field-label" for="flatTitle">Название / ЖК *</label>
          <input id="flatTitle" type="text" class="input" placeholder="Например: Светлая квартира в центре" required />
        </div>

        <div>
          <label class="field-label" for="flatPriceText">Цена (текстом для карточки) *</label>
          <input id="flatPriceText" type="text" class="input" placeholder="Например: 38 000 000 ₸ или 250 000 ₸/мес" required />
        </div>

        <div>
          <label class="field-label" for="flatPriceNum">Цена числом для фильтра (в тенге/валюте)</label>
          <input id="flatPriceNum" type="number" class="input" placeholder="Например: 38000000 (если пусто — возьмётся из цены)" />
        </div>

        <div>
          <label class="field-label" for="flatDealType">Тип сделки</label>
          <select id="flatDealType" class="select">
            <option value="sale">Постоянная покупка (Продажа)</option>
            <option value="rent">В аренду (Сдаётся)</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="flatRooms">Комнатность</label>
          <select id="flatRooms" class="select">
            <option value="">Не указано</option>
            <option value="1">1-комнатная</option>
            <option value="2">2-комнатная</option>
            <option value="3">3-комнатная</option>
            <option value="4">4-комнатная</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="flatDistrict">Район (необязательно)</label>
          <select id="flatDistrict" class="select">
            <option value="">Без района (не указан)</option>
          </select>
        </div>

        <div class="full-col">
          <label class="field-label" for="flatAddress">Адрес *</label>
          <input id="flatAddress" type="text" class="input" placeholder="Улица, дом" required />
        </div>

        <div class="full-col">
          <label class="field-label" for="flatDescription">Описание</label>
          <textarea id="flatDescription" class="textarea" placeholder="Этаж, площадь, ремонт, условия аренды или покупки..."></textarea>
        </div>

        <div class="full-col">
          <label class="field-label" for="flatPhotosInput">Фотографии квартиры</label>
          <input id="flatPhotosInput" type="file" accept="image/*" multiple class="input" />
          <div id="existingPhotosBox" class="existing-photos"></div>
        </div>

        <div class="full-col" style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="submit" id="saveFlatBtn" class="btn btn-gold">Сохранить квартиру</button>
        </div>
      </form>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid rgba(156,114,20,0.2);" />

      <div>
        <h3 style="font-size:15px; margin-bottom:8px;">Управление районами (необязательный фильтр)</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap; max-width:440px;">
          <input id="newDistrictName" type="text" class="input" placeholder="Название нового района" style="flex:1; min-width:180px;" />
          <button type="button" id="addDistrictBtn" class="btn btn-gold btn-sm">Добавить район</button>
        </div>
        <div id="adminDistrictsList" class="districts-manage"></div>
      </div>
    </section>

    <!-- ФИЛЬТРЫ ПОИСКА -->
    <section class="filters-panel">
      <div class="search-row">
        <input id="searchInput" type="text" class="input" placeholder="Поиск по адресу, названию или описанию..." />
        <button type="button" id="resetFiltersBtn" class="btn btn-ghost">Сбросить фильтры</button>
      </div>

      <!-- Сделка -->
      <div class="filter-group" id="dealChips">
        <span class="filter-label">Формат:</span>
        <button type="button" class="chip active" data-deal="all">Все</button>
        <button type="button" class="chip" data-deal="sale">Покупка</button>
        <button type="button" class="chip" data-deal="rent">В аренду (сдаётся)</button>
      </div>

      <!-- Комнаты -->
      <div class="filter-group" id="roomsChips">
        <span class="filter-label">Комнаты:</span>
        <button type="button" class="chip active" data-rooms="all">Все</button>
        <button type="button" class="chip" data-rooms="1">1-комн.</button>
        <button type="button" class="chip" data-rooms="2">2-комн.</button>
        <button type="button" class="chip" data-rooms="3">3-комн.</button>
        <button type="button" class="chip" data-rooms="4">4-комн.</button>
      </div>

      <!-- Цена -->
      <div class="price-filter-box" id="priceChips">
        <span class="filter-label">Цена:</span>
        <button type="button" class="chip active" data-price="any">Любая</button>
        <button type="button" class="chip" data-price="to_25m">До 25 млн</button>
        <button type="button" class="chip" data-price="to_50m">До 50 млн</button>
        <button type="button" class="chip" data-price="from_50m">От 50 млн</button>
        <input id="maxPriceCustom" type="number" class="price-custom-input" placeholder="До суммы (например 35000000)" />
      </div>

      <!-- Районы -->
      <div class="filter-group" id="districtChips">
        <span class="filter-label">Район:</span>
        <button type="button" class="chip active" data-district="all">Все районы</button>
      </div>
    </section>

    <!-- СПИСОК КВАРТИР -->
    <section id="flatsGrid" class="grid"></section>
    <div id="emptyState" class="empty-state" style="display:none;">Квартиры не найдены</div>
  </main>

  <footer>© 2026 GoldenGrad — недвижимость</footer>

  <!-- МОДАЛКА ПРОСМОТРА КВАРТИРЫ -->
  <div id="flatModalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size:18px;"></h3>
        <button type="button" id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <div id="modalGallery" class="modal-gallery"></div>
      <div id="modalPrice" style="font-size:17px; font-weight:800; color:var(--gold-dark); margin-bottom:6px;"></div>
      <div id="modalMeta" style="font-size:13px; color:var(--muted); margin-bottom:12px;"></div>
      <p id="modalDesc" style="font-size:14px; line-height:1.55; margin-bottom:16px; white-space:pre-line;"></p>
      <a id="modalWaLink" href="#" target="_blank" class="btn btn-wa">Написать в WhatsApp по квартире</a>
    </div>
  </div>

  <!-- МОДАЛКА ВХОДА В АДМИНКУ -->
  <div id="loginModalBackdrop" class="modal-backdrop">
    <div class="modal" style="max-width:380px;">
      <div class="modal-header">
        <h3 style="font-size:17px;">Вход в панель администратора</h3>
        <button type="button" id="closeLoginBtn" class="modal-close">&times;</button>
      </div>
      <form id="loginForm" style="display:flex; flex-direction:column; gap:12px;">
        <input id="adminPasswordInput" type="password" class="input" placeholder="Введите пароль" required />
        <button type="submit" class="btn btn-gold">Войти</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* =========================================================================

    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.style.background = isError ? "#991b1b" : "#1c180d";
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    function extractNumberFromPrice(priceText, explicitNum) {
      if (explicitNum !== null && explicitNum !== undefined && explicitNum !== "" && !Number.isNaN(Number(explicitNum))) {
        return Number(explicitNum);
      }
      if (!priceText) return null;
      const lower = String(priceText).toLowerCase();
      const cleaned = lower.replace(/\s+/g, "").replace(",", ".");
      const numMatch = cleaned.match(/(\d+(?:\.\d+)?)/);
      if (!numMatch) return null;
      let val = parseFloat(numMatch[1]);
      if (lower.includes("млн") || lower.includes("m")) {
        val = val * 1_000_000;
      } else if (lower.includes("тыс") || lower.includes("к") || lower.includes("k")) {
        val = val * 1_000;
      }
      return Math.round(val);
    }

    function buildWaUrl(flat) {
      const shareUrl = `${window.location.origin}${window.location.pathname}#flat-${flat.id}`;
      const text = flat
        ? `Здравствуйте! Интересует квартира: "${flat.title}" (${flat.price}). Ссылка: ${shareUrl}`
        : "Здравствуйте! Подскажите, пожалуйста, по актуальным квартирам GoldenGrad.";
      return `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
    }

    document.getElementById("generalWaBtn").href = buildWaUrl(null);

    async function loadData() {
      const [{ data: dData, error: dErr }, { data: fData, error: fErr }] = await Promise.all([
        sb.from("districts").select("*").order("name", { ascending: true }),
        sb.from("flats").select("*").order("created_at", { ascending: false })
      ]);

      if (dErr) {
        console.error("Ошибка загрузки районов:", dErr);
        showToast("Ошибка загрузки районов: " + dErr.message, true);
      } else {
        districts = dData || [];
      }

      if (fErr) {
        console.error("Ошибка загрузки квартир:", fErr);
        showToast("Ошибка загрузки квартир: " + fErr.message, true);
      } else {
        flats = fData || [];
      }

      renderDistrictControls();
      renderFlats();
      checkHashFlat();
    }

    function renderDistrictControls() {
      const chipsWrap = document.getElementById("districtChips");
      chipsWrap.innerHTML = `<span class="filter-label">Район:</span>`;

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "chip" + (filters.district === "all" ? " active" : "");
      allBtn.dataset.district = "all";
      allBtn.textContent = "Все районы";
      allBtn.onclick = () => {
        filters.district = "all";
        renderDistrictControls();
        renderFlats();
      };
      chipsWrap.appendChild(allBtn);

      const noDistBtn = document.createElement("button");
      noDistBtn.type = "button";
      noDistBtn.className = "chip" + (filters.district === "none" ? " active" : "");
      noDistBtn.dataset.district = "none";
      noDistBtn.textContent = "Без района";
      noDistBtn.onclick = () => {
        filters.district = "none";
        renderDistrictControls();
        renderFlats();
      };
      chipsWrap.appendChild(noDistBtn);

      districts.forEach(d => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (String(filters.district) === String(d.id) ? " active" : "");
        btn.dataset.district = d.id;
        btn.textContent = d.name;
        btn.onclick = () => {
          filters.district = String(d.id);
          renderDistrictControls();
          renderFlats();
        };
        chipsWrap.appendChild(btn);
      });

      const selectEl = document.getElementById("flatDistrict");
      const prevVal = selectEl.value;
      selectEl.innerHTML = `<option value="">Без района (необязательно)</option>`;
      districts.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.name;
        selectEl.appendChild(opt);
      });
      if (prevVal) selectEl.value = prevVal;

      const adminList = document.getElementById("adminDistrictsList");
      adminList.innerHTML = "";
      districts.forEach(d => {
        const pill = document.createElement("span");
        pill.className = "district-pill";
        pill.innerHTML = `<span>${escapeHtml(d.name)}</span><button type="button" title="Удалить">&times;</button>`;
        pill.querySelector("button").onclick = () => deleteDistrict(d.id);
        adminList.appendChild(pill);
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getFilteredFlats() {
      return flats.filter(f => {
        if (filters.deal !== "all") {
          const deal = f.deal_type || "sale";
          if (deal !== filters.deal) return false;
        }

        if (filters.rooms !== "all") {
          if (String(f.rooms || "") !== String(filters.rooms)) return false;
        }

        if (filters.district !== "all") {
          if (filters.district === "none") {
            if (f.district_id !== null && f.district_id !== undefined) return false;
          } else {
            if (String(f.district_id) !== String(filters.district)) return false;
          }
        }

        const numPrice = extractNumberFromPrice(f.price, f.price_num);
        if (filters.maxCustom && filters.maxCustom > 0) {
          if (numPrice === null || numPrice > filters.maxCustom) return false;
        } else if (filters.pricePreset !== "any") {
          if (numPrice === null) return false;
          if (filters.pricePreset === "to_25m" && numPrice > 25_000_000) return false;
          if (filters.pricePreset === "to_50m" && numPrice > 50_000_000) return false;
          if (filters.pricePreset === "from_50m" && numPrice < 50_000_000) return false;
        }

        if (filters.search.trim()) {
          const q = filters.search.trim().toLowerCase();
          const distName = districts.find(d => String(d.id) === String(f.district_id))?.name || "";
          const hay = `${f.title || ""} ${f.address || ""} ${f.description || ""} ${distName}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }

        return true;
      });
    }

    function renderFlats() {
      const grid = document.getElementById("flatsGrid");
      const empty = document.getElementById("emptyState");
      const list = getFilteredFlats();

      grid.innerHTML = "";
      if (!list.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      list.forEach(flat => {
        const distName = districts.find(d => String(d.id) === String(flat.district_id))?.name;
        const photos = Array.isArray(flat.photos) && flat.photos.length ? flat.photos : ["logo.png"];
        const dealLabel = flat.deal_type === "rent" ? "Аренда" : "Покупка";
        const roomsLabel = flat.rooms ? `${flat.rooms}-комн.` : "";

        const card = document.createElement("article");
        card.className = "card";
        card.id = `flat-${flat.id}`;

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${escapeHtml(photos[0])}" alt="${escapeHtml(flat.title)}" loading="lazy" />
            <div class="card-badges">
              <span class="badge badge-gold">${dealLabel}</span>
              ${roomsLabel ? `<span class="badge">${roomsLabel}</span>` : ""}
            </div>
          </div>
          <div class="card-body">
            <div class="card-price">${escapeHtml(flat.price)}</div>
            <div class="card-title">${escapeHtml(flat.title)}</div>
            <div class="card-meta">${distName ? `Район: ${escapeHtml(distName)} · ` : ""}${escapeHtml(flat.address || "")}</div>
            <div class="card-actions">
              <a href="${buildWaUrl(flat)}" target="_blank" class="btn btn-wa btn-sm">WhatsApp</a>
              ${isAdmin ? `
                <button type="button" class="btn btn-ghost btn-sm edit-flat-btn">✏️ Изменить</button>
                <button type="button" class="btn btn-danger btn-sm del-flat-btn">Удалить</button>
              ` : ""}
            </div>
          </div>
        `;

        card.querySelector(".card-img-wrap").onclick = () => openFlatModal(flat);
        card.querySelector(".card-title").onclick = () => openFlatModal(flat);

        if (isAdmin) {
          card.querySelector(".edit-flat-btn").onclick = () => startEditFlat(flat);
          card.querySelector(".del-flat-btn").onclick = () => deleteFlat(flat.id);
        }

        grid.appendChild(card);
      });
    }

    function openFlatModal(flat) {
      const distName = districts.find(d => String(d.id) === String(flat.district_id))?.name;
      const photos = Array.isArray(flat.photos) && flat.photos.length ? flat.photos : ["logo.png"];
      const dealLabel = flat.deal_type === "rent" ? "В аренду (сдаётся)" : "Постоянная покупка";
      const roomsLabel = flat.rooms ? `${flat.rooms}-комнатная` : "Комнатность не указана";

      document.getElementById("modalTitle").textContent = flat.title;
      document.getElementById("modalPrice").textContent = flat.price;
      document.getElementById("modalMeta").textContent = [
        dealLabel,
        roomsLabel,
        distName ? `Район: ${distName}` : "Район не указан",
        flat.address ? `Адрес: ${flat.address}` : ""
      ].filter(Boolean).join(" • ");
      document.getElementById("modalDesc").textContent = flat.description || "Описание отсутствует.";
      document.getElementById("modalWaLink").href = buildWaUrl(flat);

      const gallery = document.getElementById("modalGallery");
      gallery.innerHTML = photos.map(src => `<img src="${escapeHtml(src)}" alt="${escapeHtml(flat.title)}" />`).join("");

      window.location.hash = `flat-${flat.id}`;
      document.getElementById("flatModalBackdrop").classList.add("open");
    }

    function closeFlatModal() {
      document.getElementById("flatModalBackdrop").classList.remove("open");
      if (window.location.hash.startsWith("#flat-")) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }
    }

    document.getElementById("closeModalBtn").onclick = closeFlatModal;
    document.getElementById("flatModalBackdrop").onclick = e => {
      if (e.target.id === "flatModalBackdrop") closeFlatModal();
    };

    function checkHashFlat() {
      const h = window.location.hash || "";
      const match = h.match(/^#flat-(\d+)$/);
      if (match) {
        const found = flats.find(f => String(f.id) === match[1]);
        if (found) openFlatModal(found);
      }
    }

    /* ФИЛЬТРЫ */
    document.getElementById("searchInput").oninput = e => {
      filters.search = e.target.value;
      renderFlats();
    };

    document.querySelectorAll("#dealChips .chip").forEach(btn => {
      btn.onclick = () => {
        filters.deal = btn.dataset.deal;
        document.querySelectorAll("#dealChips .chip").forEach(b => b.classList.toggle("active", b === btn));
        renderFlats();
      };
    });

    document.querySelectorAll("#roomsChips .chip").forEach(btn => {
      btn.onclick = () => {
        filters.rooms = btn.dataset.rooms;
        document.querySelectorAll("#roomsChips .chip").forEach(b => b.classList.toggle("active", b === btn));
        renderFlats();
      };
    });

    document.querySelectorAll("#priceChips .chip").forEach(btn => {
      btn.onclick = () => {
        filters.pricePreset = btn.dataset.price;
        filters.maxCustom = null;
        document.getElementById("maxPriceCustom").value = "";
        document.querySelectorAll("#priceChips .chip").forEach(b => b.classList.toggle("active", b === btn));
        renderFlats();
      };
    });

    document.getElementById("maxPriceCustom").oninput = e => {
      const val = Number(e.target.value);
      filters.maxCustom = val > 0 ? val : null;
      if (filters.maxCustom) {
        document.querySelectorAll("#priceChips .chip").forEach(b => b.classList.remove("active"));
      } else {
        filters.pricePreset = "any";
        document.querySelector('#priceChips .chip[data-price="any"]').classList.add("active");
      }
      renderFlats();
    };

    document.getElementById("resetFiltersBtn").onclick = () => {
      filters.search = "";
      filters.deal = "all";
      filters.rooms = "all";
      filters.pricePreset = "any";
      filters.maxCustom = null;
      filters.district = "all";
      document.getElementById("searchInput").value = "";
      document.getElementById("maxPriceCustom").value = "";
      document.querySelectorAll("#dealChips .chip").forEach(b => b.classList.toggle("active", b.dataset.deal === "all"));
      document.querySelectorAll("#roomsChips .chip").forEach(b => b.classList.toggle("active", b.dataset.rooms === "all"));
      document.querySelectorAll("#priceChips .chip").forEach(b => b.classList.toggle("active", b.dataset.price === "any"));
      renderDistrictControls();
      renderFlats();
    };

    /* АДМИНКА */
    document.getElementById("adminToggleBtn").onclick = () => {
      if (isAdmin) {
        const panel = document.getElementById("adminPanel");
        panel.classList.toggle("open");
      } else {
        document.getElementById("loginModalBackdrop").classList.add("open");
      }
    };

    document.getElementById("closeLoginBtn").onclick = () => {
      document.getElementById("loginModalBackdrop").classList.remove("open");
    };

    document.getElementById("loginForm").onsubmit = e => {
      e.preventDefault();
      const pass = document.getElementById("adminPasswordInput").value;
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById("adminPasswordInput").value = "";
        document.getElementById("loginModalBackdrop").classList.remove("open");
        document.getElementById("adminPanel").classList.add("open");
        showToast("Вход выполнен");
        renderFlats();
      } else {
        showToast("Неверный пароль", true);
      }
    };

    document.getElementById("logoutAdminBtn").onclick = () => {
      isAdmin = false;
      resetFlatForm();
      document.getElementById("adminPanel").classList.remove("open");
      renderFlats();
      showToast("Вы вышли из админ-режима");
    };

    document.getElementById("addDistrictBtn").onclick = async () => {
      const inp = document.getElementById("newDistrictName");
      const name = inp.value.trim();
      if (!name) return showToast("Введите название района", true);

      const { error } = await sb.from("districts").insert([{ name }]);
      if (error) {
        console.error("Ошибка создания района:", error);
        return showToast("Не удалось добавить район: " + error.message, true);
      }
      inp.value = "";
      showToast("Район добавлен");
      await loadData();
    };

    async function deleteDistrict(id) {
      if (!confirm("Удалить район? Квартиры останутся на сайте без района.")) return;
      const { error } = await sb.from("districts").delete().eq("id", id);
      if (error) {
        console.error("Ошибка удаления района:", error);
        return showToast("Ошибка удаления: " + error.message, true);
      }
      if (String(filters.district) === String(id)) filters.district = "all";
      showToast("Район удалён");
      await loadData();
    }

    function renderExistingPhotos() {
      const box = document.getElementById("existingPhotosBox");
      box.innerHTML = "";
      editingPhotos.forEach((url, idx) => {
        const div = document.createElement("div");
        div.className = "photo-thumb";
        div.innerHTML = `<img src="${escapeHtml(url)}" alt="Фото" /><button type="button" title="Удалить фото">&times;</button>`;
        div.querySelector("button").onclick = () => {
          editingPhotos.splice(idx, 1);
          renderExistingPhotos();
        };
        box.appendChild(div);
      });
    }

    function startEditFlat(flat) {
      editingFlatId = flat.id;
      editingPhotos = Array.isArray(flat.photos) ? [...flat.photos] : [];
      document.getElementById("flatFormTitle").textContent = `Редактирование: ${flat.title}`;
      document.getElementById("saveFlatBtn").textContent = "Сохранить изменения";
      document.getElementById("cancelEditBtn").style.display = "inline-flex";

      document.getElementById("flatTitle").value = flat.title || "";
      document.getElementById("flatPriceText").value = flat.price || "";
      document.getElementById("flatPriceNum").value = flat.price_num ?? "";
      document.getElementById("flatDealType").value = flat.deal_type || "sale";
      document.getElementById("flatRooms").value = flat.rooms ? String(flat.rooms) : "";
      document.getElementById("flatDistrict").value = flat.district_id ? String(flat.district_id) : "";
      document.getElementById("flatAddress").value = flat.address || "";
      document.getElementById("flatDescription").value = flat.description || "";
      document.getElementById("flatPhotosInput").value = "";

      renderExistingPhotos();
      document.getElementById("adminPanel").classList.add("open");
      document.getElementById("adminPanel").scrollIntoView({ behavior: "smooth" });
    }

    function resetFlatForm() {
      editingFlatId = null;
      editingPhotos = [];
      document.getElementById("flatFormTitle").textContent = "Добавить новую квартиру";
      document.getElementById("saveFlatBtn").textContent = "Сохранить квартиру";
      document.getElementById("cancelEditBtn").style.display = "none";
      document.getElementById("flatForm").reset();
      document.getElementById("existingPhotosBox").innerHTML = "";
    }

    document.getElementById("cancelEditBtn").onclick = resetFlatForm;

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadSelectedFiles(files) {
      const uploadedUrls = [];
      for (const file of files) {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        const filePath = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(filePath, file, {
          cacheControl: "3600",
          upsert: false
        });

        if (!upErr) {
          const { data: pub } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
          if (pub?.publicUrl) {
            uploadedUrls.push(pub.publicUrl);
            continue;
          }
        }
        // Резервный вариант, если бакет не настроен или недоступен
        const b64 = await fileToDataUrl(file);
        uploadedUrls.push(b64);
      }
      return uploadedUrls;
    }

    document.getElementById("flatForm").onsubmit = async e => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveFlatBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Сохранение...";

      try {
        const title = document.getElementById("flatTitle").value.trim();
        const priceText = document.getElementById("flatPriceText").value.trim();
        const priceNumRaw = document.getElementById("flatPriceNum").value.trim();
        const dealType = document.getElementById("flatDealType").value;
        const roomsVal = document.getElementById("flatRooms").value;
        const distVal = document.getElementById("flatDistrict").value;
        const address = document.getElementById("flatAddress").value.trim();
        const description = document.getElementById("flatDescription").value.trim();
        const fileInput = document.getElementById("flatPhotosInput");

        const newPhotos = fileInput.files && fileInput.files.length
          ? await uploadSelectedFiles(Array.from(fileInput.files))
          : [];

        const finalPhotos = [...editingPhotos, ...newPhotos];
        const computedPriceNum = extractNumberFromPrice(priceText, priceNumRaw);

        const payload = {
          title,
          price: priceText,
          price_num: computedPriceNum,
          deal_type: dealType,
          rooms: roomsVal ? Number(roomsVal) : null,
          district_id: distVal ? Number(distVal) : null,
          address,
          description: description || null,
          photos: finalPhotos
        };

        let res;
        if (editingFlatId) {
          res = await sb.from("flats").update(payload).eq("id", editingFlatId).select();
        } else {
          res = await sb.from("flats").insert([payload]).select();
        }

        if (res.error) {
          console.error("Ошибка сохранения квартиры:", res.error);
          showToast("Ошибка сохранения: " + res.error.message, true);
          return;
        }

        showToast(editingFlatId ? "Квартира обновлена" : "Квартира добавлена на сайт");
        resetFlatForm();
        await loadData();
      } catch (err) {
        console.error(err);
        showToast("Сбой при сохранении квартиры", true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = editingFlatId ? "Сохранить изменения" : "Сохранить квартиру";
      }
    };

    async function deleteFlat(id) {
      if (!confirm("Удалить эту квартиру?")) return;
      const { error } = await sb.from("flats").delete().eq("id", id);
      if (error) {
        console.error("Ошибка удаления квартиры:", error);
        return showToast("Ошибка удаления: " + error.message, true);
      }
      if (String(editingFlatId) === String(id)) resetFlatForm();
      showToast("Квартира удалена");
      await loadData();
    }

    window.addEventListener("hashchange", checkHashFlat);
    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldenGrad — недвижимость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --gold-dark: #9c7214;
      --gold-mid: #d4a838;
      --gold-light: #fff3c4;
      --text: #1f1b12;
      --muted: #6c6350;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.85);
      --wa: #22c55e;
      --danger: #dc2626;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: var(--text);
      background: linear-gradient(225deg, #ffffff 0%, #fffdf5 45%, #fce8a6 100%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 168, 56, 0.25);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .header-inner {
        grid-template-columns: 1fr auto;
      }
      .center-mode-actions {
        grid-column: 1 / -1;
        order: 3;
        justify-content: center;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .logo-shimmer {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      background: linear-gradient(115deg, #9c7214 15%, #f5c84c 38%, #fffbe0 50%, #f5c84c 62%, #9c7214 85%);
      background-size: 220% auto;
      animation: shimmer 3.5s linear infinite;
      -webkit-mask-image: url("logo.png");
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url("logo.png");
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(115deg, #9c7214 15%, #e0b038 40%, #fff6cc 50%, #e0b038 60%, #9c7214 85%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 3.5s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .center-mode-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-mode {
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(156, 114, 20, 0.32);
      box-shadow: 0 4px 14px rgba(156, 114, 20, 0.08);
    }

    .btn-mode.active {
      background: linear-gradient(135deg, #e7bc48, #c99722);
      color: #1a1406;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(201, 151, 34, 0.28);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.98); }

    .btn-wa {
      background: var(--wa);
      color: #fff;
      padding: 11px 18px;
      font-size: 14px;
      border-radius: 14px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #e5ba45, #c79520);
      color: #1c1607;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.85);
      color: var(--text);
      border: 1px solid rgba(156, 114, 20, 0.25);
    }

    .btn-filter-toggle {
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(156, 114, 20, 0.3);
      white-space: nowrap;
    }

    .btn-filter-toggle.open,
    .btn-filter-toggle.has-active {
      background: linear-gradient(135deg, #e7bc48, #c99722);
      color: #1a1406;
      border-color: transparent;
    }

    .filter-badge {
      background: #1c160
